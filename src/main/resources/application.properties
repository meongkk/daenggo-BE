spring.application.name=daenggo
spring.profiles.active=local

server.address=0.0.0.0


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

auth.jwt.secret=${JWT_SECRET}
auth.jwt.issuer=${JWT_ISSUER:daenggo-api}
auth.jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}

# Kakao OAuth2 Client
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:local-kakao-client-id}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:local-kakao-client-secret}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/code/kakao}
spring.security.oauth2.client.registration.kakao.scope=account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-info-authentication-method=header
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# OAuth2 login hand-off to the frontend
auth.oauth2.flow-token-expiration-seconds=${OAUTH_FLOW_TOKEN_EXPIRATION_SECONDS:300}
auth.oauth2.cookie-secure=${OAUTH_COOKIE_SECURE:false}
auth.oauth2.kakao-admin-key=${KAKAO_ADMIN_KEY:}
auth.oauth2.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
auth.oauth2.frontend-login-success-url=${OAUTH_LOGIN_SUCCESS_URL:http://localhost:5173/oauth/callback}
auth.oauth2.frontend-signup-url=${OAUTH_SIGNUP_URL:http://localhost:5173/oauth/nickname}
auth.oauth2.frontend-failure-url=${OAUTH_FAILURE_URL:http://localhost:5173/login}



#spring.web.resources.static-locations=classpath:/static/,file:./uploads/

spring.servlet.multipart.enabled=true

# Community image upload limit
spring.servlet.multipart.max-file-size=10MB
# 파일 외의 multipart 정보가 조금 추가되므로 요청 전체 크기는 여유를 둡니다.
spring.servlet.multipart.max-request-size=11MB


spring.web.resources.static-locations=classpath:/static/,file:./uploads/
